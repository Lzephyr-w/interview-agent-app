spring:
  application:
    name: interview-agent-server
  config:
    import: optional:file:./.env.local[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.supabase.url}/auth/v1
          jwk-set-uri: ${app.supabase.url}/auth/v1/.well-known/jwks.json
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:interview-agent;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    create-schemas: true
  servlet:
    multipart:
      max-file-size: 800MB
      max-request-size: 810MB
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  supabase:
    url: ${SUPABASE_URL}
    storage-url: ${SUPABASE_STORAGE_URL:${app.supabase.url}/storage/v1}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    jwt-public-jwk:
      kid: ${SUPABASE_JWT_JWK_KID:}
      x: ${SUPABASE_JWT_JWK_X:}
      y: ${SUPABASE_JWT_JWK_Y:}
  resume-files:
    bucket: ${SUPABASE_RESUME_FILES_BUCKET:resume-files}
  review-model:
    url: ${AI_REVIEW_API_URL:}
    api-key: ${AI_REVIEW_API_KEY:}
    model: ${AI_REVIEW_MODEL:}
    request-timeout-seconds: ${AI_REVIEW_TIMEOUT_SECONDS:240}
  ai-mock-audio:
    bucket: ${SUPABASE_AI_MOCK_AUDIO_BUCKET:ai-mock-audio}
  tencent-asr:
    secret-id: ${TENCENT_CLOUD_SECRET_ID:}
    secret-key: ${TENCENT_CLOUD_SECRET_KEY:}
    region: ${TENCENT_CLOUD_REGION:ap-shanghai}
    engine-model-type: ${TENCENT_CLOUD_ASR_ENGINE_MODEL_TYPE:16k_zh}
  interview-import:
    engine: ${INTERVIEW_IMPORT_ASR_ENGINE:}
    hotwords: ${INTERVIEW_IMPORT_ASR_HOTWORDS:}
    request-timeout-seconds: ${INTERVIEW_IMPORT_AI_TIMEOUT_SECONDS:90}
    analysis-budget-seconds: ${INTERVIEW_IMPORT_AI_BUDGET_SECONDS:900}
  agent:
    url: ${AGENT_SERVICE_URL:http://localhost:8090}
    internal-key: ${AGENT_INTERNAL_KEY:}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
