[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-openai>=1.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
